<section class="hero" id="home" aria-labelledby="home-title">
  <div class="hero__glow hero__glow--left" aria-hidden="true"></div>
  <div class="hero__glow hero__glow--right" aria-hidden="true"></div>

  <div class="hero__layout">
    <div class="hero__copy" appStagger="[data-stagger-item]">
      <p class="hero__eyebrow" data-stagger-item>
        <span class="hero__eyebrow-mark" aria-hidden="true"></span>
        Para empresas e profissionais
      </p>

      <h1
        class="hero__title"
        id="home-title"
        aria-label="Sites profissionais para o seu negócio."
        appSplitText
      >
        <span data-split-word aria-hidden="true">Sites </span>
        <span data-split-word aria-hidden="true">profissionais </span>
        <span data-split-word aria-hidden="true">para </span>
        <span data-split-word aria-hidden="true">o </span>
        <span class="hero__title-accent" data-split-word aria-hidden="true"
          >seu negócio.</span
        >
      </h1>

      <p class="hero__description" data-stagger-item>
        A ER Web cria sites e landing pages para apresentar seus serviços, fortalecer sua presença
        digital e facilitar o contato com seus clientes pelo WhatsApp.
      </p>

      <div class="hero__actions" data-stagger-item>
        <a class="hero__quote-button" href="#contato">
          Solicitar orçamento
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.167 10h11.666M10 4.167 15.833 10 10 15.833" />
          </svg>
        </a>
      </div>
    </div>

    <div class="hero__visual" appHeroVisual>
      <div class="hero__glow-orbit" aria-hidden="true">
        <span class="hero__glow-bloom"></span>
      </div>

      <div class="hero__particles" aria-hidden="true">
        <span class="hero__particle hero__particle--1"></span>
        <span class="hero__particle hero__particle--2"></span>
        <span class="hero__particle hero__particle--3"></span>
        <span class="hero__particle hero__particle--4"></span>
        <span class="hero__particle hero__particle--5"></span>
        <span class="hero__particle hero__particle--6"></span>
        <span class="hero__particle hero__particle--7"></span>
        <span class="hero__particle hero__particle--8"></span>
      </div>

      <figure class="hero__image-frame">
        <img
          class="hero__image"
          ngSrc="/imagem-logo.png"
          alt="Sites desenvolvidos pela ER Web: escritório de advocacia e consultoria de energia solar"
          width="1200"
          height="860"
          priority
          decoding="async"
        />
        <span class="hero__image-sheen" aria-hidden="true"></span>
      </figure>
    </div>
  </div>
</section>

<app-why-landing />
<app-services />
<app-work />
<app-process />
<app-about />
<app-testimonials />
<app-faq />
<app-final-cta />
<app-contact />
<app-site-footer />
